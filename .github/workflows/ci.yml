name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality / format, lint, safety, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: make fmt-check

      - name: Lint every target and feature
        run: make clippy

      - name: Lint without default features
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

      - name: Enforce panic and unsafe boundaries in production code
        run: make clippy-strict

      - name: Build all documentation
        run: make doc

  tests:
    name: Tests / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            runner: ubuntu-24.04
            test_no_default_features: true
          - platform: Linux AArch64
            runner: ubuntu-24.04-arm
            test_no_default_features: false
    container:
      image: ubuntu:24.04
      options: --privileged --cap-add SYS_ADMIN --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential ca-certificates clang curl git libclang-dev make \
            pkg-config procps python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Relax perf restrictions when available
        run: sysctl -w kernel.perf_event_paranoid=-1 || true

      - name: Test all features
        env:
          STACKPULSE_REQUIRE_PYTHON_PERF: "1"
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Test without default features
        if: ${{ matrix.test_no_default_features }}
        run: cargo test --workspace --no-default-features --locked

  msrv:
    name: Compatibility / minimum Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev pkg-config

      - id: rust
        name: Read the declared Rust version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Compile every target with the declared baseline
        run: cargo check --workspace --all-targets --all-features --locked

  features:
    name: Compatibility / feature combinations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@b27e114ddbae5cc01df19a22cf70a124d5177567 # v2.86.0
        with:
          tool: cargo-hack

      - name: Check every library feature combination
        run: cargo hack check --package stackpulse --feature-powerset --locked

  package:
    name: Distribution / crates.io package
    needs: [quality, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: List packaged files
        run: cargo package --list --locked

      - name: Build the crate exactly as published
        run: cargo publish --dry-run --locked

  semver:
    name: Compatibility / public API
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@b27e114ddbae5cc01df19a22cf70a124d5177567 # v2.86.0
        with:
          tool: cargo-semver-checks

      - name: Check the public API against crates.io
        run: cargo semver-checks check-release

  audit:
    name: Security / dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@b27e114ddbae5cc01df19a22cf70a124d5177567 # v2.86.0
        with:
          tool: cargo-audit

      - name: Audit the locked dependency graph
        run: cargo audit --deny warnings

  distro:
    name: Scheduled / ${{ matrix.distro }}
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 22.04
            image: ubuntu:22.04
            family: apt
          - distro: Debian Bookworm
            image: debian:bookworm
            family: apt
          - distro: Debian Trixie
            image: debian:trixie
            family: apt
          - distro: Fedora
            image: fedora:latest
            family: dnf
          - distro: Arch Linux
            image: archlinux:latest
            family: pacman
    container:
      image: ${{ matrix.image }}
      options: --privileged --cap-add SYS_ADMIN --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install system dependencies
        run: |
          if [[ "${{ matrix.family }}" == "apt" ]]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
              build-essential ca-certificates clang curl git libclang-dev make pkg-config procps python3
          elif [[ "${{ matrix.family }}" == "dnf" ]]; then
            dnf install --assumeyes ca-certificates clang clang-devel curl gcc gcc-c++ git make pkgconf-pkg-config procps-ng python3
          else
            pacman -Syu --noconfirm --needed base-devel ca-certificates clang curl git make pkgconf procps-ng python
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Relax perf restrictions when available
        run: sysctl -w kernel.perf_event_paranoid=-1 || true

      - name: Run the default test suite
        run: cargo test --workspace --all-targets --locked

  required:
    name: Required checks
    needs: [quality, tests, msrv, features, package, audit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every required job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
