[package]
name = "framehop-stackpulse"
version = "0.16.2"
edition = "2021"
rust-version = "1.88"
authors = ["Markus Stange <mstange.moz@gmail.com>"]
categories = ["development-tools::debugging"]
description = "StackPulse's maintained Framehop stack unwinder"
keywords = ["unwind", "stackwalk", "profiling", "debug"]
license = "MIT OR Apache-2.0"
readme = "Readme.md"
documentation = "https://docs.rs/framehop-stackpulse/"
repository = "https://github.com/pablogsal/stackpulse/"
exclude = ["/.github", "/.vscode", "/tests", "/fixtures", "/big-fixtures"]

[lib]
name = "framehop"

[dependencies]
gimli = { version = "0.33", default-features = false, features = ["read"] }
macho-unwind-info = { version = "0.5.0", optional = true }
pe-unwind-info = { version = "0.6", optional = true }
fallible-iterator = "0.3.0"
arrayvec = { version = "0.7.4", default-features = false }
cfg-if = "1.0.0"

[features]
default = ["std", "macho", "pe"]
macho = ["macho-unwind-info"]
pe = ["pe-unwind-info"]
std = ["arrayvec/std", "gimli/std"]

[dev-dependencies]
object = "0.39"
flate2 = "1.0.28"
itertools = "0.14"
